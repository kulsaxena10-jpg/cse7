<html> 
<head>
    <title>
       Hotel Room Booking Form
    </title>
</head>
<body>
    <h1 align="center"> Hotel Room Booking Form </h1>
    <center>
      <form>
    <label for="full name" > full name </label>
       <input type="full name" id="full name" name ="full name" >
    </input>
<br>


<label for="email" > email </label>
       <input type="email" id="email" name="email" >
    </input>
    <br>

<label for="phone" > phone
       <input type="tel" id="phone" name="phone" >
    </input>
     </label>
    <br>

    <label for="checkin " > check-in date
       <input type="date" id="checkin" name="checkin" >
    </input>
     </label>
    <br>

<label for="checkout" > check-out date
       <input type="date" id="checkout" name="checkout" >
    </input>
     </label>
     <br>

     <label for="guests" > Number of Guests
       <input type="number" id="guests" name="guests" min="1" max="10">
    </input>
     </label>
    <br>

<label for="roomtype" > Room Type
       <select id="roomtype" name="roomtype">
         <option value="single">Single</option>
         <option value="double">Double</option>
         <option value="suite">Suite</option>
       </select>
    </label>
    <br>
<label for="request"> Special Requests 
   <textarea id="request" name="request" rows="4" cols="50">
   </textarea>
</label>
     <br>
     <input type="submit" value="Submit">
     <input type="reset" value="Reset">
     </form>
</center>
</body>     
</html>
