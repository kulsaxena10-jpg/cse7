<html> 
<head>
    <title>
       Registration Form
    </title>
</head>
<body>
    <center>
   <h1>Student Form Registration </h1>
   <hr>
    <form action="./thankyou.html">
        <label for="first-name" >First Name:</label>
        <input type="text" id="first-name" name="first-name" placeholder="enter your first name"></input>
        <br>
         <br>
         <label for="last name" >last Name:</label>
        <input type="text" id="last-name" name="first-name"placeholder="enter your last name"></input>
        <br>
         <br>
         <label for="phone-number" >Phone Number:</label>
        <input type="tel" id="phone-number" name="phone-number" placeholder="phone number"></input>
        <br>
         <br>
         <label for="email" >email:</label>
        <input type="email" id="email" name="email" placeholder="email"></input>
        
        <br>
         <br>
         <label for="male" >male:</label>
        <input type="radio" id="male" name="gender"></input>
        
         <label for="female" >female:</label>
        <input type="radio" id="female" name="gender"></input>
<br>
<br>
        <label for="stream" >select stream</label>
        <select>
            <option value="arts">Arts</option>
            <option value="pcb">PCB</option>
            <option value="pcm">PCM</option>
        </select>
        <br>
        <br>
        <label for="password"> Password</label>
        <input type="password" id="password" name="password" placeholder="password"></input>
        <br>
        <br>
        <label for="age"> Age</label>
        <input type="number" id="age" name="age" placeholder="age" ></input>
        <br>
        <br>
        <label for="hobbies">Hobbies</label>
        <textarea name="hobbies"  rows="10" cols="80"></textarea>
        <br>
        <br>
         <input type="submit" value="register"></input>
         <hr>


            </form>
    </center>
    </body>
    </html>
